<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dragon Shield VR - Boss Battle</title>
<script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Rajdhani:wght@500;700&display=swap');
body{margin:0;overflow:hidden;background:#020617;color:white;font-family:'Rajdhani',sans-serif;user-select:none}
.fantasy-title{font-family:'Cinzel',serif}
#crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:21;pointer-events:none}
#aframe-scene{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#ui-container,#damage-flash{z-index:10}
#damage-flash{pointer-events:none;transition:opacity .15s;z-index:20}
#start-overlay,#end-overlay{z-index:30}
.glow-gold{text-shadow:0 0 10px #f59e0b,0 0 20px #f59e0b66}
</style>
<script>
AFRAME.registerComponent('fireball-projectile',{
 schema:{speed:{type:'number',default:8},targetX:{type:'number',default:0},targetY:{type:'number',default:1.6},targetZ:{type:'number',default:0}},
 init:function(){
  this.reflected=false;this.ready=false;
  this.start=new THREE.Vector3();this.target=new THREE.Vector3();this.dir=new THREE.Vector3();
  this.pos=new THREE.Vector3();this.next=new THREE.Vector3();this.shield=new THREE.Vector3();
  this.camera=new THREE.Vector3();this.dragon=new THREE.Vector3();
 },
 play:function(){
  this.el.object3D.getWorldPosition(this.start);
  this.target.set(this.data.targetX,this.data.targetY,this.data.targetZ);
  this.dir.subVectors(this.target,this.start).normalize();this.ready=true;
 },
 tick:function(t,ms){
  const g=window.gameManager;if(!g||!g.active||!this.ready)return;
  const dt=Math.min(ms/1000,.05);if(dt<=0)return;
  this.el.object3D.getWorldPosition(this.pos);
  this.next.copy(this.pos).addScaledVector(this.dir,this.data.speed*dt);
  const parent=this.el.object3D.parent;
  if(parent){parent.updateWorldMatrix(true,false);parent.worldToLocal(this.next)}
  this.el.object3D.position.copy(this.next);
  this.el.object3D.getWorldPosition(this.pos);
  const cam=document.getElementById('camera'),shield=document.getElementById('desktop-shield-mesh'),dragon=document.getElementById('dragon-root');
  if(cam)cam.object3D.getWorldPosition(this.camera);
  if(shield)shield.object3D.getWorldPosition(this.shield);
  if(dragon)dragon.object3D.getWorldPosition(this.dragon);
  if(!this.reflected&&shield&&this.pos.distanceTo(this.shield)<1.4){
   this.reflected=true;window.sfx.playShieldBlock();
   this.dir.subVectors(this.dragon,this.pos).normalize();this.data.speed=22;
   const a=this.el.querySelector('.fb-outer'),b=this.el.querySelector('.fb-inner');
   if(a)a.setAttribute('color','#38bdf8');if(b)b.setAttribute('color','#e0f2fe');
   g.score+=150;g.deflectedCount++;g.updateUI();return;
  }
  if(!this.reflected&&this.pos.distanceTo(this.camera)<1){
   g.takePlayerDamage();this.el.remove();return;
  }
  if(this.reflected&&this.pos.distanceTo(this.dragon)<2.8){
   g.damageDragon(25);g.score+=250;g.updateUI();this.el.remove();return;
  }
  if(Math.abs(this.pos.x)>35||Math.abs(this.pos.y)>25||this.pos.z>5||this.pos.z< -40)this.el.remove();
 }
});
AFRAME.registerComponent('magic-bolt',{
 schema:{speed:{type:'number',default:34}},
 init:function(){this.dir=new THREE.Vector3();this.pos=new THREE.Vector3();this.next=new THREE.Vector3();this.dragon=new THREE.Vector3();this.ready=false},
 play:function(){const c=document.getElementById('camera');if(c){c.object3D.getWorldDirection(this.dir);this.ready=true}},
 tick:function(t,ms){
  const g=window.gameManager;if(!g||!g.active||!this.ready)return;
  const dt=Math.min(ms/1000,.05);this.el.object3D.getWorldPosition(this.pos);
  this.next.copy(this.pos).addScaledVector(this.dir,this.data.speed*dt);
  const p=this.el.object3D.parent;if(p){p.updateWorldMatrix(true,false);p.worldToLocal(this.next)}
  this.el.object3D.position.copy(this.next);this.el.object3D.getWorldPosition(this.pos);
  const d=document.getElementById('dragon-root');if(d)d.object3D.getWorldPosition(this.dragon);
  if(this.pos.distanceTo(this.dragon)<2.6){g.damageDragon(5);g.score+=30;g.updateUI();this.el.remove();return}
  if(this.pos.z< -35||Math.abs(this.pos.x)>30||Math.abs(this.pos.y)>25)this.el.remove();
 }
});
</script>
</head>
<body>
<div id="crosshair"><div class="w-10 h-10 border border-cyan-400 rounded-full flex items-center justify-center"><div class="w-2 h-2 bg-amber-400 rounded-full"></div></div></div>
<div id="ui-container" class="absolute inset-0 pointer-events-none flex flex-col justify-between p-4">
 <div class="flex justify-between items-start gap-3">
  <div class="bg-slate-900/90 p-3 rounded-xl"><div class="text-blue-400 text-xs">🛡️ PLAYER HEALTH</div><div id="player-hearts" class="text-2xl">❤️ ❤️ ❤️</div></div>
  <div class="text-center bg-slate-900/90 border border-amber-500/40 px-5 py-2 rounded-xl"><div class="text-amber-400 text-xs">SCORE</div><div id="score-text" class="text-3xl text-amber-300 fantasy-title">0</div><div class="text-xs">Deflected: <span id="deflect-count">0</span></div></div>
  <div class="bg-slate-900/90 p-3 rounded-xl"><div class="text-red-400 text-xs">🐉 IGNIS</div><div id="dragon-hp-text">100 / 100 HP</div></div>
 </div>
 <div class="text-center self-center bg-slate-900/90 p-3 rounded-full text-sm">Aim your shield at fireballs to deflect them. Click or tap to shoot magic bolts!</div>
</div>
<div id="damage-flash" class="absolute inset-0 bg-red-600/40 opacity-0"></div>
<div id="start-overlay" class="absolute inset-0 bg-slate-950/95 flex items-center justify-center p-6 text-center">
 <div class="max-w-xl w-full border border-amber-500/40 bg-slate-900 p-8 rounded-2xl">
  <div class="text-5xl mb-4">🛡️</div><h1 class="fantasy-title text-4xl font-black text-amber-400 mb-4">DRAGON SHIELD VR</h1>
  <p class="text-slate-300 mb-6">Deflect Ignis's fireballs with your shield and attack the dragon with magic bolts!</p>
  <button id="start-btn" class="w-full p-4 bg-gradient-to-r from-amber-500 to-red-600 font-bold text-xl rounded-xl">START BATTLE</button>
 </div>
</div>
<div id="end-overlay" class="absolute inset-0 bg-slate-950/95 hidden items-center justify-center p-6 text-center">
 <div class="max-w-md w-full bg-slate-900 p-8 rounded-2xl">
  <h2 id="end-title" class="fantasy-title text-4xl mb-3"></h2><p id="end-subtitle" class="mb-6"></p>
  <p>Final score: <span id="end-score">0</span></p><p>Fireballs deflected: <span id="end-deflected">0</span></p>
  <button id="restart-btn" class="w-full p-3 mt-6 bg-orange-600 font-bold rounded-xl">PLAY AGAIN</button>
 </div>
</div>
<a-scene id="aframe-scene" embedded>
 <a-sky color="#0a0a1a"></a-sky><a-ambient-light intensity=".9"></a-ambient-light>
 <a-light type="directional" color="#ffedd5" intensity="1.5" position="5 10 5"></a-light>
 <a-plane position="0 0 -10" rotation="-90 0 0" width="60" height="60" color="#111827"></a-plane>
 <a-ring position="0 .01 -10" rotation="-90 0 0" radius-inner="2" radius-outer="22" color="#1f2937"></a-ring>
 <a-entity id="dragon-root" position="0 2.5 -12">
  <a-entity position="0 4.2 0"><a-plane width="5.2" height=".5" color="#020617"></a-plane><a-plane id="boss-hp-3d-fill" width="5" height=".4" position="0 0 .02" color="#dc2626"></a-plane><a-text value="IGNIS THE FIRE DRAGON" align="center" position="0 .55 .02" width="6" color="#fef08a"></a-text></a-entity>
  <a-cone id="dragon-torso" radius-top=".8" radius-bottom="1.8" height="3.2" rotation="25 0 0" color="#b91c1c"><a-sphere position="0 .2 -.7" radius=".75" color="#f97316"></a-sphere></a-cone>
  <a-entity id="wing-left" position="-1.4 .5 0"><a-box position="-1.8 0 0" width="3.2" height=".1" depth="1.4" color="#991b1b"></a-box></a-entity>
  <a-entity id="wing-right" position="1.4 .5 0"><a-box position="1.8 0 0" width="3.2" height=".1" depth="1.4" color="#991b1b"></a-box></a-entity>
  <a-entity position="0 1.4 -.8"><a-cylinder position="0 .6 -.3" radius=".5" height="1.2" color="#b91c1c"></a-cylinder>
   <a-entity position="0 1.2 -.6"><a-box position="0 0 -.6" width="1" height=".7" depth="1.3" color="#991b1b"></a-box>
    <a-sphere position="-.45 .2 -.6" radius=".18" color="#facc15"></a-sphere><a-sphere position=".45 .2 -.6" radius=".18" color="#facc15"></a-sphere>
    <a-cone position="-.4 .6 0" radius-bottom=".14" height="1" color="#0f172a"></a-cone><a-cone position=".4 .6 0" radius-bottom=".14" height="1" color="#0f172a"></a-cone>
    <a-sphere id="mouth-glow" position="0 -.1 -1.3" radius=".5" color="#ff3300" material="shader:flat;opacity:.15;transparent:true"></a-sphere>
   </a-entity>
  </a-entity>
 </a-entity>
 <a-entity id="player-rig"><a-entity id="camera" camera look-controls position="0 1.6 0">
  <a-entity position=".35 -.45 -.75" rotation="-10 -12 0"><a-box id="desktop-shield-mesh" width=".55" height=".75" depth=".05" color="#0f172a">
   <a-box width=".59" height=".79" depth=".01" color="#0284c7"></a-box><a-plane width=".48" height=".68" position="0 0 .03" color="#38bdf8" material="shader:flat;opacity:.35;transparent:true;side:double"></a-plane><a-octahedron radius=".14" position="0 0 .05" color="#f59e0b"></a-octahedron>
  </a-box></a-entity>
 </a-entity></a-entity>
</a-scene>
<script>
class SoundFX{
 constructor(){this.ctx=null}
 init(){if(!this.ctx){const A=window.AudioContext||window.webkitAudioContext;if(A)this.ctx=new A()}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()}
 tone(type,f1,f2,d,v=.3){if(!this.ctx)return;const n=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(f1,n);o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.01,n+d);o.connect(g);g.connect(this.ctx.destination);o.start(n);o.stop(n+d)}
 playFireball(){this.tone('sawtooth',320,70,.6,.25)}
 playShieldBlock(){this.tone('triangle',900,250,.35,.4)}
 playHurt(){this.tone('sawtooth',160,40,.3,.4)}
 playBolt(){this.tone('sine',500,1400,.15,.2)}
}
window.sfx=new SoundFX();

class GameManager{
 constructor(){
  this.active=false;this.playerHp=3;this.maxPlayerHp=3;this.dragonHp=100;this.maxDragonHp=100;
  this.score=0;this.deflectedCount=0;this.lastSpawnTime=0;this.spawnInterval=2000;this.animTime=0;this.lastFrame=0;
  this.scene=document.getElementById('aframe-scene');this.dragon=document.getElementById('dragon-root');
  this.wingL=document.getElementById('wing-left');this.wingR=document.getElementById('wing-right');this.mouth=document.getElementById('mouth-glow');
  this.initEvents();this.updateUI();this.loop();
 }
 initEvents(){
  document.getElementById('start-btn').onclick=()=>this.startGame();
  document.getElementById('restart-btn').onclick=()=>this.startGame();
  window.addEventListener('click',e=>{if(!this.active||e.target.closest('#start-overlay,#end-overlay,button'))return;this.spawnBolt()});
  window.addEventListener('keydown',e=>{if(e.code==='Space'&&this.active){e.preventDefault();this.spawnBolt()}});
 }
 startGame(){
  window.sfx.init();this.clearProjectiles();this.active=true;
  this.playerHp=3;this.dragonHp=100;this.score=0;this.deflectedCount=0;
  this.lastSpawnTime=performance.now();this.dragon.setAttribute('position','0 2.5 -12');
  document.getElementById('start-overlay').classList.add('hidden');
  const end=document.getElementById('end-overlay');end.classList.add('hidden');end.classList.remove('flex');this.updateUI();
 }
 clearProjectiles(){this.scene.querySelectorAll('[fireball-projectile],[magic-bolt]').forEach(e=>e.remove())}
 spawnFireball(){
  if(!this.active)return;
  window.sfx.playFireball();
  const e=document.createElement('a-entity');
  e.setAttribute('position',`${(Math.random()-.5)*1.2} ${2.7+Math.random()*.8} -10.5`);
  e.innerHTML=`<a-sphere class="fb-outer" radius=".8" color="#ff2200" material="shader:flat;emissive:#ff2200"></a-sphere><a-sphere class="fb-inner" radius=".45" color="#ffff00" material="shader:flat"></a-sphere><a-light type="point" color="#ff4400" intensity="3" distance="8"></a-light>`;
  this.scene.appendChild(e);
  e.setAttribute('fireball-projectile',{speed:8+Math.min(this.deflectedCount*.4,7),targetX:(Math.random()-.5)*5,targetY:1.6+(Math.random()-.5)*2.4,targetZ:0});
 }
 spawnBolt(){
  if(!this.active)return;window.sfx.playBolt();
  const c=document.getElementById('camera'),p=new THREE.Vector3();c.object3D.getWorldPosition(p);
  const e=document.createElement('a-entity');e.setAttribute('position',`${p.x} ${p.y} ${p.z}`);
  e.innerHTML='<a-sphere radius=".22" color="#38bdf8" material="shader:flat;emissive:#38bdf8"></a-sphere>';
  this.scene.appendChild(e);e.setAttribute('magic-bolt',{speed:34});
 }
 loop(){
  const frame=now=>{
   const dt=this.lastFrame?Math.min((now-this.lastFrame)/1000,.1):0;this.lastFrame=now;this.animTime+=dt;
   const y=2.5+Math.sin(this.animTime*2)*.4;this.dragon.setAttribute('position',`0 ${y} -12`);
   const a=Math.sin(this.animTime*4)*22;this.wingL.setAttribute('rotation',`0 0 ${12+a}`);this.wingR.setAttribute('rotation',`0 0 ${-12-a}`);
   if(this.active){
    // Continuous spawner: runs on every animation frame while active.
    if(now-this.lastSpawnTime>=this.spawnInterval){this.lastSpawnTime=now;this.spawnFireball()}
    this.mouth.setAttribute('material','opacity',now-this.lastSpawnTime>this.spawnInterval-600?.9:.15);
   }else this.mouth.setAttribute('material','opacity',.1);
   requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
 }
 takePlayerDamage(){
  if(!this.active)return;window.sfx.playHurt();this.playerHp=Math.max(0,this.playerHp-1);this.updateUI();
  const f=document.getElementById('damage-flash');f.style.opacity='1';setTimeout(()=>f.style.opacity='0',200);
  if(this.playerHp<=0)this.gameOver(false);
 }
 damageDragon(n){
  if(!this.active)return;this.dragonHp=Math.max(0,this.dragonHp-n);this.updateUI();
  const torso=document.getElementById('dragon-torso');torso.setAttribute('color','#fff');setTimeout(()=>torso.setAttribute('color','#b91c1c'),120);
  if(this.dragonHp<=0)this.gameOver(true);
 }
 updateUI(){
  document.getElementById('player-hearts').textContent=Array.from({length:3},(_,i)=>i<this.playerHp?'❤️':'🖤').join(' ');
  document.getElementById('dragon-hp-text').textContent=`${this.dragonHp} / 100 HP`;
  document.getElementById('score-text').textContent=this.score;
  document.getElementById('deflect-count').textContent=this.deflectedCount;
  const ratio=this.dragonHp/100,fill=document.getElementById('boss-hp-3d-fill');
  fill.setAttribute('width',Math.max(.001,5*ratio));fill.setAttribute('position',`${-2.5*(1-ratio)} 0 .02`);
 }
 gameOver(win){
  if(!this.active)return;this.active=false;this.clearProjectiles();
  document.getElementById('end-score').textContent=this.score;document.getElementById('end-deflected').textContent=this.deflectedCount;
  document.getElementById('end-title').textContent=win?'VICTORY!':'DEFEATED IN FLAMES';
  document.getElementById('end-subtitle').textContent=win?'You defeated Ignis and defended the realm!':'The dragon overwhelmed your shield. Try again!';
  const e=document.getElementById('end-overlay');e.classList.remove('hidden');e.classList.add('flex');
 }
}
window.addEventListener('load',()=>{window.gameManager=new GameManager()});
</script>
</body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    </head>
    <body>
        <a-scene>
         <a-sky color="lightblue"></a-sky>   
                <a-plane position="0 -1 0" height="40" 
                    width="40" rotation="-90 0 0"
                    color="green"></a-plane>
                     <a-box
            position="0 0 -4" color="grey" height="0.3" width="1"
                animation="
                property: position;
                from: 0 0.5 -4;
                to: 0 2.5 -4;
                loop: true;
                dir: alternate;
                dur: 1500;
                easing: "easeIn";
                "
                animation__2="
                property: scale;
                from: 1 1 1;
                to: 0 0 0;
                dur: 1000;
                 startEvents:click;
            "
            
            ></a-box>
            <a-sphere
            position="3 4 -7" color="yellow" height="0.3" width="1"
             animation="
                property: position;
                from: 3 5 -7;
                to: -3 5 -7;
                loop: true;
                dir: alternate;
                dur: 1700;
                easing: "easeOut";
                "
                
                animation__2="
                property: scale;
                from: 1 1 1;
                to: 0 0 0;
                dur: 1000;
                 startEvents:click;
            "
            
            ></a-sphere>
            <a-dodecahedron position="3 0 -7" radius="1.2" color="black" 
            animation="
                property: position;
            from: 3 0 -10;
                to: 3 0 -7;
                loop: true;
                dir: alternate;
                dur: 2300;
                easing: "easeInOutBack";
            
            
            "
              animation__2="
                property: scale;
                from: 1 1 1;
                to: 0 0 0;
                dur: 1000;
                 startEvents:click;
            "
            >
            </a-dodecahedron>
                        <a-camera>
                <a-cursor></a-cursor>
            </a-camera>
        </a-scene>
    </body>
</html>
